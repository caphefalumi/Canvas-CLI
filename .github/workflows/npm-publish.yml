name: Publish

on:
  release:
    types: [created]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish # matches the "Environment name" you configure on npmjs.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - run: npm publish
